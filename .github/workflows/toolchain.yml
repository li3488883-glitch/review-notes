name: toolchain

# Packs the Gradle + Android SDK cache into the "toolchain" release so the app can be built offline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toolchain.yml']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - run: bash app/tools/toolchain.sh
